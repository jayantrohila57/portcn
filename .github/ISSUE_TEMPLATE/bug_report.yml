name: Bug report
description: Report a reproducible problem in the current project.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please check existing issues before filing a report.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include commands and a minimal reproduction when possible.
      render: shell
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js, pnpm, and relevant package versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove credentials and other sensitive information before sharing.
    validations:
      required: false
