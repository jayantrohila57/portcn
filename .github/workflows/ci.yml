name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  branch-policy:
    name: branch-policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const { evaluateBranchPolicy } = require('./scripts/branch-policy.cjs');
            const pr = context.payload.pull_request;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const result = evaluateBranchPolicy({ eventName: context.eventName, pullRequest: pr, commits });
            if (!result.allowed) core.setFailed(result.reason);
            const { checkDocumentation } = require('./scripts/documentation-policy.cjs');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100,
            });
            const docs = checkDocumentation({ files: files.map(file => file.filename), body: pr.body, base: pr.base.ref, head: pr.head.ref });
            if (!docs.allowed) core.setFailed(docs.reason);
            if (pr.base.ref === 'main' && pr.head.ref === 'release-please--branches--main--components--portcn') {
              const match = /^chore\(main\): release (\d+\.\d+\.\d+)$/.exec(pr.title);
              if (!match) core.setFailed('Invalid release title.');
              else {
                const result = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path: 'CHANGELOG.md', ref: pr.head.sha });
                const changelog = Buffer.from(result.data.content, 'base64').toString('utf8');
                const policy = require('./scripts/changelog-policy.cjs');
                const check = policy.validateRelease(changelog, match[1]);
                if (!check.allowed) core.setFailed(check.reason);
                else if (!changelog.includes(`[${match[1]}]: https://github.com/${context.repo.owner}/${context.repo.repo}/compare/`)) core.setFailed('Release changelog is missing its version comparison link.');
              }
            }
            if (pr.base.ref === 'dev' && pr.head.ref !== 'main-to-dev-sync') {
              const { validate } = require('./scripts/changelog-policy.cjs');
              const content = async ref => {
                const result = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path: 'CHANGELOG.md', ref });
                return Buffer.from(result.data.content, 'base64').toString('utf8');
              };
              const issueMatch = /(?:Closes|Fixes|Resolves)\s+#(\d+)/i.exec(pr.body ?? '');
              const check = validate(await content(pr.base.sha), await content(pr.head.sha), pr.title, pr.head.ref, issueMatch?.[1], files.map(file => file.filename));
              if (!check.allowed) core.setFailed(check.reason);
            }

  validate:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate commit messages
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref != 'main-to-dev-sync'
        run: node scripts/check-commit-messages.mjs "$PR_BASE_SHA" "$PR_HEAD_SHA"
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - run: pnpm lifecycle:test
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm build
      - name: Run dashboard PTY matrix
        run: node --test scripts/dashboard-pty.test.mjs
      - run: pnpm package:check
      - name: Pack CLI for Node 22 runtime validation
        run: mkdir -p "$RUNNER_TEMP/portcn-package" && npm pack --pack-destination "$RUNNER_TEMP/portcn-package"
        working-directory: apps/cli
      - uses: actions/upload-artifact@v4
        with:
          name: portcn-package
          path: ${{ runner.temp }}/portcn-package/*.tgz
          if-no-files-found: error
      - run: pnpm boundaries:check
      - run: pnpm release:check
      - run: pnpm docs:check

  node22-runtime:
    name: Node 22 packaged runtime
    needs: validate
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: portcn-package
          path: ${{ runner.temp }}/portcn-package
      - name: Install and exercise the packed CLI under Node 22
        run: |
          package_file="$(find "$RUNNER_TEMP/portcn-package" -name 'portcn-*.tgz' -print -quit)"
          test -n "$package_file"
          install_dir="$RUNNER_TEMP/portcn-node22"
          client_version="$(node -p "require('./apps/cli/package.json').devDependencies['@modelcontextprotocol/client']")"
          package_version="$(node -p "require('./apps/cli/package.json').version")"
          npm install --prefix "$install_dir" --engine-strict --no-audit --no-fund --omit=dev "$package_file" "@modelcontextprotocol/client@${client_version}"
          executable="$install_dir/node_modules/portcn/dist/index.js"
          test "$(node "$executable" --version)" = "$package_version"
          node "$executable" --help | grep -q 'Usage: portcn'
          cd "$install_dir"
          PORTCN_EXECUTABLE="$executable" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { Client } from '@modelcontextprotocol/client';
          import { StdioClientTransport } from '@modelcontextprotocol/client/stdio';

          const transport = new StdioClientTransport({
            command: process.execPath,
            args: [process.env.PORTCN_EXECUTABLE, 'mcp'],
            cwd: process.cwd(),
          });
          const client = new Client({ name: 'node22-runtime-check', version: '1.0.0' });
          try {
            await client.connect(transport);
            const { tools } = await client.listTools();
            assert.deepEqual(tools.map(({ name }) => name).sort(), [
              'check_port_availability',
              'diagnose_port',
              'discovery_snapshot',
              'list_listeners',
              'suggest_ports',
            ]);
            const result = await client.callTool({
              name: 'suggest_ports',
              arguments: { range: '1-65535', limit: 5 },
            });
            assert.equal(result.isError, true);
            assert.equal(result.structuredContent?.error?.code, 'INVALID_ARGUMENT');
          } finally {
            await client.close();
          }
          NODE

  macos-discovery:
    name: macOS listener discovery
    runs-on: macos-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @portcn/core build
      - run: pnpm --filter portcn build
      - name: Verify macOS lsof discovery and a live listener
        run: pnpm --filter portcn exec vitest run test/list.test.ts
