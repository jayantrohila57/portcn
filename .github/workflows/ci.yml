name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  branch-policy:
    name: branch-policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const { evaluateBranchPolicy } = require('./scripts/branch-policy.cjs');
            const pr = context.payload.pull_request;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const result = evaluateBranchPolicy({ eventName: context.eventName, pullRequest: pr, commits });
            if (!result.allowed) core.setFailed(result.reason);

  validate:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - name: Run monorepo validation in Docker
        run: pnpm docker:test
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
      - name: Build packaged CLI runtime image
        run: pnpm docker:build
      - name: Smoke-test default CLI output
        run: pnpm docker:cli
      - name: Smoke-test CLI help
        run: pnpm docker:cli -- --help
      - name: Smoke-test CLI version
        run: test "$(pnpm docker:cli -- --version)" = "0.0.1"
      - name: Clean local Compose resources
        if: always()
        run: pnpm docker:clean
