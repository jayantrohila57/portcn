name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to publish
        required: true
        type: string

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      id-token: write
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check out released source
        if: steps.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || steps.release.outputs.tag_name }}
          fetch-depth: 1
      - name: Set up Node for npm Trusted Publishing
        if: steps.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - name: Set up Node for npm Trusted Publishing
        if: steps.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install released dependencies
        if: steps.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
        env:
          HUSKY: "0"
        run: pnpm install --frozen-lockfile
      - name: Verify changelog reconciliation
        if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_VERSION: ${{ inputs.tag || steps.release.outputs.version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const { reconcileRelease } = require("./scripts/changelog-policy.cjs");
            reconcileRelease(fs.readFileSync("CHANGELOG.md", "utf8"), process.env.RELEASE_VERSION.replace(/^v/, ""));
          '
      - name: Verify and publish CLI package
        if: steps.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.tag || steps.release.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          node -e "const p=require('./apps/cli/package.json'); if (p.version !== process.env.RELEASE_VERSION) { throw new Error('CLI version '+p.version+' does not match Release Please '+process.env.RELEASE_VERSION); }"
          pnpm --filter @portcn/core build
          pnpm --filter portcn build
          mkdir -p /tmp/portcn-release
          pnpm --filter portcn pack --pack-destination /tmp/portcn-release
          package_path="/tmp/portcn-release/portcn-${RELEASE_VERSION}.tgz"
          test -f "$package_path"
          node scripts/check-cli-package.mjs
          registry_error="$(mktemp)"
          if published="$(npm view "portcn@${RELEASE_VERSION}" version --json 2>"$registry_error")"; then
            test "${published//\"/}" = "$RELEASE_VERSION" || { echo "Registry has conflicting portcn@$published" >&2; exit 1; }
            echo "portcn@$RELEASE_VERSION is already published; skipping duplicate publication."
          else
            if ! grep -q 'E404' "$registry_error"; then
              cat "$registry_error" >&2
              echo 'Unable to determine existing npm publication; refusing to publish.' >&2
              exit 1
            fi
            npm publish "$package_path" --access public --provenance
          fi
      - name: Dispatch GitHub Packages publication
        if: steps.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || steps.release.outputs.tag_name }}
        run: gh workflow run github-packages.yml --ref main -f tag="$RELEASE_TAG"
