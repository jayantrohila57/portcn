name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Prepare a Release Please candidate or recover publication
        required: true
        type: choice
        options: [prepare, publish]
      tag:
        description: Existing Release Please tag, required for publication recovery
        required: false
        type: string

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      id-token: write
    steps:
      - id: release
        if: github.event_name == 'push' || inputs.action == 'prepare'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check out approved release commit
        if: steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || steps.release.outputs.tag_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        if: steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        if: steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install released dependencies
        if: steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
        env:
          HUSKY: "0"
        run: pnpm install --frozen-lockfile
      - name: Verify release commit and changelog
        if: steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
        env:
          RELEASE_TAG: ${{ inputs.tag || steps.release.outputs.tag_name }}
        run: node scripts/verify-release-commit.mjs "$RELEASE_TAG"
      - name: Update GitHub Release notes from canonical changelog
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          node scripts/release-notes-body.mjs "$RELEASE_TAG" > /tmp/release-notes.md
          gh release edit "$RELEASE_TAG" --notes-file /tmp/release-notes.md
      - name: Dispatch GitHub Packages publication for this exact tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run github-packages.yml --ref main -f "tag=$RELEASE_TAG"
      - name: Build and publish npm package idempotently
        if: steps.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.action == 'publish')
        env:
          RELEASE_TAG: ${{ inputs.tag || steps.release.outputs.tag_name }}
        run: node scripts/publish-npm.mjs "$RELEASE_TAG"
